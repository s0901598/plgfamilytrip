<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="2026噗嚨共家族旅遊・彰化三天兩夜 10/24（六）– 10/26（一）行程電子書">
<meta property="og:title" content="2026噗嚨共家族旅遊">
<meta property="og:description" content="彰化三天兩夜 10/24（六）– 10/26（一）行程電子書，左右滑動翻頁">
<meta name="theme-color" content="#FBF6EC">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>2026噗嚨共家族旅遊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面:直式單頁繪本,一次一頁,左右滑動翻頁;米白紙底,Day 1 紅、Day 2 藍、Day 3 綠 */
:root{
  --paper:#FBF6EC; --paper2:#F3E9D6; --desk:#E9DDC7; --card:#FFFFFF;
  --ink:#4A3B2F; --muted:#86766A; --line:#E6D8C1; --tbd:#A39482;
  --d1:#D9503F; --d1s:#FBE3DE;
  --d2:#3A7FBF; --d2s:#DCEAF6;
  --d3:#4F9445; --d3s:#E0EFD8;
  --w:#C9752A;  --ws:#F7E6D0;
  --gold:#F2B544; --gold-ink:#5A3D00;
  --lab1:#E0457B; --lab2:#2F86D2; --lab3:#4A9636; --lab4:#EC7424;
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --c:var(--w); --cs:var(--ws);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html,body{overflow:hidden;overscroll-behavior:none}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
/* 快速連點不要觸發 iPhone 點兩下放大;兩指放大照常可用 */
button,.nav,.topbar,.lv,.lv-body{touch-action:manipulation}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:10px}
img{-webkit-user-drag:none;user-select:none;-webkit-touch-callout:none}
.track{-webkit-user-select:none;user-select:none}

.day1{--c:var(--d1);--cs:var(--d1s)}
.day2{--c:var(--d2);--cs:var(--d2s)}
.day3{--c:var(--d3);--cs:var(--d3s)}
.warm{--c:var(--w);--cs:var(--ws)}

.stage{height:100%;display:flex;align-items:center;justify-content:center}
.book{position:relative;width:100%;max-width:430px;height:100%;background:var(--paper);overflow:hidden}
@media (min-width:600px){
  .book{height:min(94%,920px);border-radius:32px;box-shadow:0 24px 60px rgba(74,59,47,.22)}
}
.track{display:flex;height:100%;transition:transform .32s ease;will-change:transform}
.page{flex:0 0 100%;min-width:0;height:100%;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain;padding:74px 20px 112px;position:relative;background:var(--paper)}
.page.tint{background:var(--cs)}

/* 標題色帶 */
.band{display:flex;align-items:center;gap:10px;background:var(--c);color:#fff;border-radius:18px;padding:12px 16px;margin-bottom:14px}
.band .t{font-family:var(--f-display);font-size:24px;line-height:1.3;text-wrap:balance;min-width:0}
.lv .band .t{font-size:clamp(19px,5.6vw,24px);white-space:nowrap}
.band .chip{margin-left:auto;background:rgba(255,255,255,.24);border-radius:999px;padding:2px 10px;font-size:15px;font-weight:700;white-space:nowrap}
.star-badge{display:inline-flex;align-items:center;gap:4px;background:var(--gold);color:var(--gold-ink);font-weight:700;font-size:15px;border-radius:999px;padding:3px 12px;margin-bottom:10px}
.frame{border:5px double var(--c);border-radius:24px;padding:16px 14px;background:var(--card)}
.muted{color:var(--muted)}

/* 插圖預留 */
.illus{margin:0}
.illus img{display:block;width:100%;max-width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:20px}
.illus figcaption{display:none}
.illus.missing img{display:none}
.illus.missing figcaption{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;aspect-ratio:3/2;max-width:100%;border:2.5px dashed var(--c);background:var(--cs);border-radius:20px;text-align:center;padding:12px;color:var(--c)}
.page.tint .illus.missing figcaption{background:var(--card)}
.ph-tag{font-weight:700;font-size:13px;background:var(--card);border:1.5px solid var(--c);border-radius:999px;padding:1px 10px}
.ph-desc{font-size:15px;color:var(--ink);line-height:1.4}
.ph-file{font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
.illus.below{margin-top:18px}
.illus.above{margin-bottom:16px}
.illus.hero{width:100%;margin:6px 0 22px}
.illus.full{position:absolute;inset:0}
.illus.full img{height:100%;aspect-ratio:auto;border-radius:0}
.illus.full.missing figcaption{aspect-ratio:auto;height:100%;border:0;border-radius:0;background:transparent;justify-content:flex-end;padding:0 24px 150px}

/* 圖文並排 */
.intro{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.intro > div{flex:1;min-width:0}
.intro .illus{flex:0 0 52%}
.intro .ph-desc{font-size:13px}
.stat{font-family:var(--f-display);font-size:36px;color:var(--c);line-height:1.1}
.intro p{font-size:16px;line-height:1.5;margin-top:4px}

/* 時間軸 */
.tl{list-style:none;position:relative}
.tl::before{content:"";position:absolute;left:67px;top:14px;bottom:14px;border-left:3px dotted var(--c);opacity:.45}
.tl > li{display:grid;grid-template-columns:54px 26px minmax(0,1fr);align-items:start;padding:7px 0}
.tl-time{font-weight:700;color:var(--c);font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
.tl-dot{width:15px;height:15px;border-radius:50%;background:var(--paper);border:3px solid var(--c);margin:6px auto 0;position:relative;z-index:1}
.tl li.star .tl-dot{background:var(--gold);border-color:var(--gold)}
.tl-title{font-weight:700;font-size:19px;line-height:1.45}
.tl-note{color:var(--muted);font-size:15px;line-height:1.45;margin-top:2px}
.go{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:15px;font-weight:700;color:var(--c);background:var(--cs);border:0;border-radius:999px;padding:4px 12px;cursor:pointer}
.go .s{color:var(--gold-ink);background:var(--gold);border-radius:50%;width:18px;height:18px;display:inline-grid;place-items:center;font-size:11px}

/* 分組卡片 */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:350px){.grid{grid-template-columns:1fr}}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px}
.card h3{font-family:var(--f-display);font-weight:400;font-size:19px;color:var(--c);display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:6px}
.seat{font-family:var(--f-body);font-size:13px;font-weight:700;background:var(--cs);color:var(--c);border-radius:999px;padding:1px 8px;white-space:nowrap}
/* 名單:一列一位,寬度一致 */
.names{display:flex;flex-direction:column;gap:5px}
.name{display:block;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:3px 10px;font-size:17px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 房間 */
.sec{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:20px;margin:4px 0 8px}
.sec::after{content:"";flex:1;border-top:2px dashed var(--line)}
.rooms{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.room{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:9px 12px}
.room .no{font-family:var(--f-display);font-size:27px;color:var(--c);text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.room .type{display:block;font-family:var(--f-body);font-size:13px;color:var(--muted);margin-top:4px}
.room .who{font-size:18px;font-weight:500;line-height:1.45}
.room.staff{background:var(--paper2)}
.room.staff .no{color:var(--muted)}

/* 分隔頁 */
.divwrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.big{font-family:var(--f-display);font-size:68px;color:var(--c);line-height:1;letter-spacing:3px}
.date{font-size:22px;font-weight:700;margin-top:8px}
.theme{margin-top:14px;background:var(--card);border-radius:999px;padding:8px 20px;font-size:18px;text-wrap:balance}
/* 行程頁上方:插圖 + DAY + 日期 + 主題 */
.dayhead{background:var(--cs);border-radius:24px;padding:14px 14px 18px;text-align:center;margin-bottom:16px}
.dayhead .illus{margin-bottom:12px}
.dayhead .illus.missing figcaption{background:var(--card)}
.dayhead .big{font-size:52px}
.dayhead .date{margin-top:6px}
.dayhead .theme{margin-top:10px;display:inline-block}

/* 封面、封底 */
.cover{padding:0;background:linear-gradient(180deg,#FDF4E3 0%,#FBE6CF 100%)}
.cover-text{position:absolute;top:0;left:0;right:0;padding:72px 24px 0;text-align:center;z-index:2}
.pill{display:inline-block;background:var(--d1);color:#fff;border-radius:999px;padding:4px 14px;font-size:15px;font-weight:700}
.cover h1{font-family:var(--f-display);font-weight:400;font-size:42px;line-height:1.2;margin-top:16px;text-wrap:balance}
.cover h1 .yr{display:block;font-size:60px;color:var(--d1);letter-spacing:2px}
.cover .date{margin-top:10px}
.cover .welcome{margin-top:12px;font-size:18px}
.hint{position:absolute;left:0;right:0;bottom:96px;text-align:center;z-index:2;font-weight:700;color:var(--d1)}
.hint span{display:inline-block;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(-8px)}}
.back-wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 20px 120px;text-align:center}
.cover-wrap{gap:14px}
.cover-wrap h1{margin-top:0}
.cover-wrap .date{margin-top:0}
.cover-wrap .hint{position:static}
.back-wrap .logo{display:block;width:100%;max-width:360px;height:auto}
.back h1{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.45;text-wrap:balance}
.contact{margin-top:14px;display:inline-block;border:2px dashed var(--tbd);border-radius:14px;padding:6px 14px;font-size:16px;color:var(--tbd);background:rgba(255,255,255,.6)}
.contact b{color:var(--ink)}

/* 目錄 */
/* 快捷按鈕列:可左右捲動,第 4 個只露一半,提示後面還有 */
.quick{display:flex;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;margin:0 -20px 18px;padding:2px 20px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:0 0 calc((100% - 4px) / 3.5);scroll-snap-align:start;scroll-margin-left:20px;background:var(--card);border:2px solid var(--gold);border-radius:16px;padding:14px 4px;font-weight:700;font-size:16px;line-height:1.35;white-space:nowrap;cursor:pointer}
.toc-g{margin-bottom:12px}
.toc-g h3{font-family:var(--f-display);font-weight:400;font-size:17px;color:var(--c);margin-bottom:2px}
.toc-item{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;border-bottom:1.5px dashed var(--line);padding:9px 2px;font-size:18px;text-align:left;cursor:pointer}
.toc-item .pg{margin-left:auto;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.toc-item.sub{padding-left:30px;font-size:16px;color:var(--muted)}
.toc-item .s{color:var(--gold-ink);background:var(--gold);border-radius:50%;width:20px;height:20px;display:inline-grid;place-items:center;font-size:12px;flex:0 0 20px}

/* 總覽 */
.daycards{display:flex;flex-direction:column;gap:10px}
.daycard{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--cs);border-radius:18px;padding:12px 14px;cursor:pointer}
.daycard .h{display:flex;align-items:baseline;gap:8px;font-family:var(--f-display);font-size:21px;color:var(--c)}
.daycard .h small{font-family:var(--f-body);font-size:16px;font-weight:700;color:#1F1A16}
.daycard .h .arr{margin-left:auto;font-size:18px}
.daycard ul{list-style:none;display:flex;flex-wrap:wrap;gap:2px 0;margin-top:6px}
.daycard li{font-size:16px;font-weight:500}
.daycard li:not(:last-child)::after{content:"›";color:var(--c);margin:0 7px;font-weight:700}

/* 待補 */
.bigtime{font-family:var(--f-display);font-size:52px;color:var(--c);text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.bigtime small{display:block;font-family:var(--f-body);font-size:16px;color:var(--muted);margin-top:6px}
.tbd{border:2px dashed var(--tbd);border-radius:14px;padding:10px 14px;color:var(--tbd);background:var(--paper);font-size:16px}
.tbd b{display:block;color:var(--ink);font-size:17px}
.tbds{display:flex;flex-direction:column;gap:8px;margin-top:18px}

/* 必帶用品 */
.bar{height:10px;border-radius:999px;background:var(--paper2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--c);border-radius:999px;transition:width .25s}
.checks{display:flex;flex-direction:column;gap:7px}
.check{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;font-size:18px;text-align:left;cursor:pointer;line-height:1.4}
.check .box{flex:0 0 26px;height:26px;border-radius:8px;border:2.5px solid var(--c);display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px}
.check.on .box{background:var(--c)}
.check.on .box::after{content:"✓"}
.check.on .lbl{color:var(--muted);text-decoration:line-through}
.check .lbl small{display:block;font-size:14px;color:var(--muted);text-decoration:none}

/* 注意事項 */
.notes{list-style:none;counter-reset:n;display:flex;flex-direction:column;gap:8px}
.notes li{display:flex;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:11px 14px;font-size:17px;line-height:1.5}
.notes li::before{counter-increment:n;content:counter(n);flex:0 0 28px;height:28px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.notes li.tbdli{border:2px dashed var(--tbd);color:var(--tbd);background:var(--paper)}
.notes li.tbdli b{color:var(--ink)}

/* 關卡 */
.levels{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.lv-btn{display:flex;align-items:center;gap:10px;width:100%;background:var(--cs);border:0;border-radius:14px;padding:10px 14px;font-size:18px;font-weight:700;text-align:left;cursor:pointer}
.lv-btn .n{flex:0 0 auto;background:var(--c);color:#fff;border-radius:999px;padding:1px 10px;font-size:14px}
.lv-btn .arr{margin-left:auto;color:var(--c)}
.info{border:2px solid var(--cs);border-radius:14px;padding:10px 14px;background:var(--card);font-size:16px}
.info b{display:block;font-size:17px}
.shot{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in;position:relative;margin-bottom:6px}
.shot img{display:block;width:100%;max-width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:16px;border:1.5px solid var(--line)}
.shot.tall{margin-bottom:14px}
.shot.tall img{aspect-ratio:2/3}
.shot .zoom{position:absolute;right:8px;bottom:8px;background:rgba(74,59,47,.78);color:#fff;font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px}
.rules{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.rule{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start}
.rule .lab{color:#fff;font-weight:700;font-size:15px;border-radius:999px;padding:2px 10px;white-space:nowrap;margin-top:2px}
.rule:nth-child(1) .lab{background:var(--lab1)}
.rule:nth-child(2) .lab{background:var(--lab2)}
.rule:nth-child(3) .lab{background:var(--lab3)}
.rule:nth-child(4) .lab{background:var(--lab4)}
.rule:nth-child(5) .lab{background:var(--w)}
/* 美食連連看 */
.shot.free img{aspect-ratio:auto}
.bingo-wrap{position:relative;margin-top:8px}
.bingo-wrap svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.bingo-wrap line{stroke:#E0302A;stroke-width:5;stroke-linecap:round;opacity:.75}
.bingo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:1fr;gap:6px}
.bingo > *{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;font-size:15px;font-weight:700;line-height:1.35;display:flex;flex-direction:column;justify-content:center}
.bingo small{display:block;font-size:12px;font-weight:700;color:var(--c)}
.bingo .free{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.bingo .free small{color:var(--gold-ink)}
.bingo button{cursor:pointer}
.bingo button.on{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.bingo button.on small{color:var(--gold-ink)}
.rule p{font-size:18px;line-height:1.55}
.rule p + p{margin-top:4px}
.lb{position:absolute;inset:0;z-index:20;background:rgba(40,30,22,.92);display:flex;align-items:center;justify-content:center;padding:16px;touch-action:pinch-zoom}
.lb[hidden]{display:none}
.lb img{max-width:100%;max-height:100%;border-radius:12px}
.lb button{position:absolute;top:12px;right:14px;background:var(--card);border:0;border-radius:999px;padding:6px 16px;font-weight:700;font-size:16px;cursor:pointer}
.lb p{position:absolute;bottom:24px;left:0;right:0;text-align:center;color:#fff;font-size:14px}

/* 翻頁列 */
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px 18px;z-index:5;pointer-events:none}
.nav button{pointer-events:auto;width:56px;height:56px;border-radius:50%;border:0;background:var(--nav,var(--w));color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 0 rgba(74,59,47,.18)}
.nav button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(74,59,47,.18)}
.nav button.hide{visibility:hidden}
.nav button[hidden]{display:none}
.nav .home-btn{width:auto;padding:0 18px 0 14px;border-radius:999px;display:flex;align-items:center;gap:6px;font-weight:700;font-size:17px}
.nav .home-btn svg{width:22px;height:22px}
.nav svg{width:26px;height:26px}
#pageno{pointer-events:auto;background:var(--card);border-radius:999px;padding:4px 14px;font-weight:700;font-size:16px;box-shadow:0 2px 8px rgba(74,59,47,.14);font-variant-numeric:tabular-nums}
/* 固定 top bar:內容捲動時從它下面經過,不會壓到按鈕 */
.topbar{position:absolute;top:0;left:0;right:0;z-index:6;height:56px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--bar,var(--paper));border-bottom:1.5px solid var(--line)}
.topbar[hidden]{display:none}
.where{background:var(--nav,var(--w));color:#fff;border-radius:999px;padding:3px 12px;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.toc-btn{margin-left:auto;flex:0 0 auto;background:var(--card);border:2px solid var(--nav,var(--w));color:var(--nav,var(--w));border-radius:999px;padding:3px 14px;font-weight:700;font-size:16px;cursor:pointer}
.toc-btn[hidden]{display:none}

/* 晚會流程 */
.flow{list-style:none;display:flex;flex-direction:column;gap:6px;margin-top:6px;padding-left:12px;border-left:3px solid var(--cs)}
.flow li{display:block;padding:0;font-size:16px;line-height:1.45}
.flow b{color:var(--c);margin-right:6px;font-variant-numeric:tabular-nums}
.flow span{display:block;font-size:15px;color:var(--muted)}
.shot.catering{margin-top:10px;cursor:zoom-in}
.shot.catering .illus img,.shot.catering .illus.missing figcaption{border-radius:14px}

/* ===== 翻頁 ===== */
const track = document.getElementById('track');
const book = document.getElementById('book');
track.innerHTML = P.map((p,k)=>`<section class="page ${p.cls}" aria-label="第 ${k+1} 頁：${p.toc}">${p.html()}</section>`).join('');
const pages = [...track.children];
const N = pages.length;
const prevBtn = document.getElementById('prev'), nextBtn = document.getElementById('next'), homeBtn = document.getElementById('home');
const pageno = document.getElementById('pageno'), tocBtn = document.getElementById('tocBtn');
const navColor = {day1:'--d1',day2:'--d2',day3:'--d3',warm:'--w'};
let cur = 0;

const topbar = document.getElementById('topbar'), where = document.getElementById('where');
function barLabel(k){
  const c = pages[k].classList;
  if (c.contains('cover')) return null;
  const d = [1,2,3].find(d=>c.contains('day'+d));
  return d ? `DAY ${d}・${DAYS[d].date}` : P[k].toc;
}
function go(n, instant){
  n = Math.max(0, Math.min(N-1, n));
  if (n !== cur){   // 每一頁都從最上方開始,快捷按鈕列也回到第一個
    pages[n].scrollTop = 0;
    pages[n].querySelectorAll('.quick').forEach(q=>{ q.scrollLeft = 0; });
  }
  cur = n;
  track.style.transition = instant ? 'none' : '';
  track.style.transform = `translateX(${-cur*100}%)`;
  pages.forEach((p,k)=>{ p.inert = k!==cur; });
  prevBtn.classList.toggle('hide', cur===0);
  nextBtn.hidden = cur===N-1;          // 封底:下一頁的位置換成「回首頁」
  homeBtn.hidden = cur!==N-1;
  pageno.textContent = `${cur+1} / ${N}`;
  const label = barLabel(cur);
  topbar.hidden = !label;
  where.textContent = label || '';
  tocBtn.hidden = P[cur].id==='overview';
  const key = Object.keys(navColor).find(k=>pages[cur].classList.contains(k)) || 'warm';
  book.style.setProperty('--nav', `var(${navColor[key]})`);
  book.style.setProperty('--bar', pages[cur].classList.contains('tint') ? `var(${navColor[key]}s)` : 'var(--paper)');
  try{ history.replaceState(null,'','#p'+(cur+1)); }catch(e){}
}
prevBtn.onclick = ()=>go(cur-1);
nextBtn.onclick = ()=>go(cur+1);
homeBtn.onclick = ()=>go(0);
tocBtn.onclick = ()=>go(pg('overview')-1);

/* 關卡:嵌在團康、晚會頁裡打開 */
const lv = document.getElementById('lv'), lvBody = document.getElementById('lvBody'), lvBack = document.getElementById('lvBack');
const ACT = {games:['團康','16:15'], party:['晚會','18:00']};
/* 可以一層一層打開(例:DAY 2 → 團康 → 第1關),返回時一層一層退回 */
const stack = [];
function renderTop(){
  const top = stack[stack.length-1], prev = stack[stack.length-2];
  lvBody.innerHTML = top.html;
  lv.className = 'lv ' + top.cls;
  const label = prev ? prev.title : P[cur].toc;
  lvBack.textContent = '‹ 返回' + (/^[A-Z]/.test(label) ? ' ' : '') + label;
  lvBody.scrollTop = 0;
  if (top.after) top.after();
}
function openSheet(html, cls, title, after){
  stack.push({html, cls, title, after});
  lv.hidden = false; book.classList.add('lv-open');
  renderTop();
}
function closeLevel(){
  stack.pop();
  if (stack.length) renderTop();
  else { lv.hidden = true; book.classList.remove('lv-open'); }
}
lvBack.onclick = closeLevel;
document.addEventListener('click', e=>{
  const c = e.target.closest('[data-level]');
  if (c){ const [name, time] = ACT[c.dataset.act]; openSheet(levelHTML(+c.dataset.level, name, time), 'day2'); return; }
  const s = e.target.closest('[data-sheet]');
  if (s){ const S = SHEETS[s.dataset.sheet]; openSheet(S.html(), S.cls, S.title, S.after); }
});

/* 隱藏驚喜:團康頁的「★ 特別活動」2 秒內連點 5 下,一張一張公布隊長 */
const cap = document.getElementById('cap');
let secretTaps = [];
function capAsk(){
  cap.innerHTML = `<div class="cap-box cap-ask">

function capCard(i){

}
function closeCap(){ cap.hidden = true; cap.innerHTML = ''; }
document.addEventListener('click', e=>{
  if (!e.target.closest('[data-secret]')) return;
  const now = Date.now();
  secretTaps = [...secretTaps.filter(t=>now-t < 2000), now];
  if (secretTaps.length >= 5){ secretTaps = []; capAsk(); cap.hidden = false; }
});
cap.addEventListener('click', e=>{
  const b = e.target.closest('[data-cap]'); if (!b) return;
  if (b.dataset.cap==='close') closeCap(); else capCard(+b.dataset.cap);
});
document.addEventListener('keydown', e=>{
  if (!cap.hidden){ if (e.key==='Escape') closeCap(); e.stopImmediatePropagation(); }
}, true);

document.addEventListener('keydown', e=>{
  if (!lb.hidden){ if (e.key==='Escape') closeLb(); return; }
  if (!lv.hidden){ if (e.key==='Escape') closeLevel(); return; }
  if (e.key==='ArrowRight') go(cur+1);
  else if (e.key==='ArrowLeft') go(cur-1);
});
document.addEventListener('click', e=>{

window.addEventListener('hashchange', ()=>{

book.addEventListener('scroll', ()=>{ book.scrollLeft = 0; });

/* 觸控滑動:手指向左滑 → 下一頁,向右滑 → 上一頁 */
/* 觸控翻頁:手指向左滑 → 下一頁,向右滑 → 上一頁
   一開始就判斷方向;就算一開始被當成上下捲動,放開手時整體是明顯的左右滑,一樣翻頁 */
let x0=0, y0=0, dx=0, dir=null, t0=0;
track.addEventListener('touchstart', e=>{
  if (e.touches.length > 1 || e.target.closest('.quick')){ dir = 'none'; return; }   // 快捷按鈕列自己左右捲,不翻頁
  const t = e.touches[0]; x0=t.clientX; y0=t.clientY; dx=0; dir=null; t0=Date.now();
},{passive:true});
track.addEventListener('touchmove', e=>{
  if (dir==='none') return;
  if (e.touches.length > 1){ dir='none'; go(cur); return; }
  const t = e.touches[0]; const mx=t.clientX-x0, my=t.clientY-y0;
  if (dir===null){
    if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
    dir = Math.abs(mx) >= Math.abs(my) ? 'h' : 'v';
  }
  if (dir!=='h') return;
  if (e.cancelable) e.preventDefault();   // 左右滑時不讓頁面上下動
  const w = track.clientWidth;
  dx = Math.max(-w, Math.min(w, mx));
  const edge = (cur===0 && dx>0) || (cur===N-1 && dx<0);
  track.style.transition = 'none';
  track.style.transform = `translateX(calc(${-cur*100}% + ${edge?dx*0.25:dx}px))`;
},{passive:false});
function endSwipe(e){
  if (dir==='none'){ dir=null; return; }
  const t = e && e.changedTouches && e.changedTouches[0];
  const fx = t ? t.clientX-x0 : dx, fy = t ? t.clientY-y0 : 0;
  const quick = Date.now()-t0 < 400;
  // 左右滑:超過 50px,或很快地甩一下超過 30px
  const flip = dir==='h' ? (Math.abs(fx) > 50 || (quick && Math.abs(fx) > 30))
                         : (Math.abs(fx) > 70 && Math.abs(fx) > Math.abs(fy)*1.5);
  if (flip) go(fx < 0 ? cur+1 : cur-1); else if (dir==='h') go(cur);
  dir = null; dx = 0;
}
track.addEventListener('touchend', endSwipe);
track.addEventListener('touchcancel', ()=>{ if (dir==='h') go(cur); dir=null; dx=0; });

/* 電腦:觸控板兩指左右滑 */
let wheelX = 0, wheelLock = 0;
book.addEventListener('wheel', e=>{
  if (!lv.hidden || !lb.hidden || !cap.hidden) return;
  if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
  if (e.target.closest('.quick')) return;
  e.preventDefault();
  if (Date.now() < wheelLock) return;
  wheelX += e.deltaX;
  if (Math.abs(wheelX) > 60){ go(wheelX > 0 ? cur+1 : cur-1); wheelX = 0; wheelLock = Date.now() + 700; }
},{passive:false});

/* 電腦:滑鼠按住左右拖 */
let mx0 = null, my0 = 0, mDragged = false;
track.addEventListener('pointerdown', e=>{ if (e.pointerType==='mouse' && e.button===0 && !e.target.closest('.quick')){ mx0=e.clientX; my0=e.clientY; mDragged=false; } });
window.addEventListener('pointerup', e=>{
  if (mx0===null || e.pointerType!=='mouse') return;
  const fx = e.clientX-mx0, fy = e.clientY-my0; mx0 = null;
  if (Math.abs(fx) > 60 && Math.abs(fx) > Math.abs(fy)*1.5){ mDragged = true; go(fx < 0 ? cur+1 : cur-1); }
});
track.addEventListener('click', e=>{ if (mDragged){ e.stopPropagation(); e.preventDefault(); mDragged=false; } }, true);
track.addEventListener('dragstart', e=>e.preventDefault());

/* 必帶用品勾選(只存在自己的手機) */
const PKEY = 'pulonggong2026-pack';
let packed = [];
try{ packed = JSON.parse(localStorage.getItem(PKEY)) || []; }catch(e){ packed = []; }
function renderPack(){
  document.querySelectorAll('[data-pack]').forEach(b=>{
    const on = packed.includes(+b.dataset.pack);
    b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
  });
  document.querySelectorAll('.packCount').forEach(el=>{ el.textContent = packed.length; });
  document.querySelectorAll('.packBar').forEach(el=>{ el.style.width = (packed.length/PACK.length*100)+'%'; });
}
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-pack]'); if (!b) return;
  const i = +b.dataset.pack;
  packed = packed.includes(i) ? packed.filter(x=>x!==i) : [...packed, i];
  try{ localStorage.setItem(PKEY, JSON.stringify(packed)); }catch(e){}
  renderPack();
});
renderPack();

/* 美食連連看:點格子上色,再點取消;中間自由格子固定上色。連成一線畫紅線(只存在自己的手機) */
const BKEY = 'pulonggong2026-bingo';
const BLINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let bingoOn = [];
try{ bingoOn = JSON.parse(localStorage.getItem(BKEY)) || []; }catch(e){ bingoOn = []; }
function renderBingo(){
  const wrap = lvBody.querySelector('.bingo-wrap'); if (!wrap) return;
  const cells = [...wrap.querySelectorAll('[data-bingo]')];
  const done = i => !FOOD[i][0] || bingoOn.includes(i);
  cells.forEach(b=>{
    if (b.tagName !== 'BUTTON') return;
    const on = bingoOn.includes(+b.dataset.bingo);
    b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
  });
  const W = wrap.getBoundingClientRect(), svg = wrap.querySelector('svg');
  svg.setAttribute('viewBox', `0 0 ${W.width} ${W.height}`);
  const mid = i => { const r = cells[i].getBoundingClientRect(); return [r.left-W.left+r.width/2, r.top-W.top+r.height/2]; };
  svg.innerHTML = BLINES.filter(l=>l.every(done)).map(l=>{
    const [x1,y1] = mid(l[0]), [x2,y2] = mid(l[2]);
    const len = Math.hypot(x2-x1, y2-y1) || 1, ex = (x2-x1)/len*18, ey = (y2-y1)/len*18;   // 線頭稍微超出格子中心
    return `<line x1="${x1-ex}" y1="${y1-ey}" x2="${x2+ex}" y2="${y2+ey}"/>`;
  }).join('');
}
document.addEventListener('click', e=>{
  const b = e.target.closest('button[data-bingo]'); if (!b) return;
  const i = +b.dataset.bingo;
  bingoOn = bingoOn.includes(i) ? bingoOn.filter(x=>x!==i) : [...bingoOn, i];
  try{ localStorage.setItem(BKEY, JSON.stringify(bingoOn)); }catch(e){}
  renderBingo();
});
window.addEventListener('resize', renderBingo);

const m = /^#p(\d+)$/.exec(location.hash);
cur = -1;
go(m ? +m[1]-1 : 0, true);   // 打開時直接停在該頁,不播放滑動動畫
</script>
